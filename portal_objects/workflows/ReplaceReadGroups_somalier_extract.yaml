## Workflow information #####################################
#     General information for the workflow
#############################################################
name: ReplaceReadGroups_somalier_extract
description: Replace the sample name across the @RG definitions of the input file in BAM format. |
             Run Somalier extract function on the reheadered file

runner:
  language: cwl
  main: ReplaceReadGroups_somalier_extract.cwl

software:
  - Samtools@1.17
  - Somalier@v0.2.19

category:
  - Quality Control

## Input information ########################################
#     Input files and parameters
#############################################################
input:

  # Required file arguments
  input_file_bam:
    argument_type: file.bam

  variant_sites:
    argument_type: file.vcf_gz

  genome_reference_fasta:
    argument_type: file.fa

  # Required parameter arguments
  sample_name:
    argument_type: parameter.string

## Output information #######################################
#     Output files and quality controls
#############################################################
output:

  # File output
  output_file_somalier:
    argument_type: file.somalier
